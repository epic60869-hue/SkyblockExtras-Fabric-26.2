name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build

      - name: Find mod JAR
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No mod JAR found!"
            exit 1
          fi

          echo "Found JAR: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)

          TAG="v${VERSION}"

          echo "Creating release ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Uploading JAR..."
            gh release upload "$TAG" "${{ steps.jar.outputs.path }}" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG" \
              "${{ steps.jar.outputs.path }}" \
              --title "Skyblock Extras ${TAG}" \
              --generate-notes
          fi
